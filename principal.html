<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principal — EskwelaPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="boot-screen" class="boot-screen">Loading EskwelaPay…</div>

<div id="app-screen" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-seal topbar-seal-img"><img src="assets/logo.png" alt="EskwelaPay seal"></div>
      <div>
        <div class="topbar-title">EskwelaPay</div>
        <div class="topbar-sub">Sta. Lucia National High School</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="role-pill"><span class="dot"></span><span id="role-pill-text"></span></span>
      <button class="btn-logout" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/firebase-config.js"></script>
<script src="js/shared.js"></script>
<script>
const NAV_PRINCIPAL = [
  {key:'dashboard', label:'School Overview', icon:'🏛️'},
  {key:'reports', label:'Reports & Summary', icon:'📁'},
];
let currentPage = 'dashboard';

function enterApp(){
  document.getElementById('boot-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  renderSidebar();
  renderPage();
}
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = NAV_PRINCIPAL.map(it=>`
    <button class="nav-item ${it.key===currentPage?'active':''}" data-page="${it.key}">
      <span>${it.icon}</span><span>${it.label}</span>
    </button>
  `).join('');
  sb.querySelectorAll('.nav-item').forEach(b=>{
    b.addEventListener('click', ()=>{ currentPage=b.dataset.page; renderSidebar(); renderPage(); });
  });
}
async function renderPage(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state">Loading…</div>`;
  try{
    if(currentPage==='dashboard') main.innerHTML = await pageDashboard(true);
    if(currentPage==='reports') main.innerHTML = await pageReports(false);
  }catch(e){
    console.error(e);
    main.innerHTML = `<div class="empty-state">Could not load this page: ${e.message||e}. This is usually a Firestore Security Rules mismatch - check the browser console for the exact denied-permission error.</div>`;
    return;
  }
  wirePageEvents();
}
function wirePageEvents(){
  wireQrButtons(document.getElementById('main'));
  wireReportEvents();
}

guardPage(['principal'], ()=>{ enterApp(); });
</script>
</body>
</html>
